<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>登录 · 爱回收 商品图库</title>
<style>
  :root {
    --bg: #0c131d;
    --panel: #151d2b;
    --panel-2: #1b2534;
    --line: #253143;
    --ink: #e8edf5;
    --ink-2: #a9b6c8;
    --ink-3: #7f8da3;
    --accent: #2f6fed;
    --accent-2: #3d7bf5;
    --err: #ff8f86;
    --err-bg: rgba(160, 45, 40, .18);
    --err-line: rgba(220, 90, 80, .45);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a2740 0%, rgba(12, 19, 29, 0) 60%),
      var(--bg);
    color: var(--ink);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 388px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 30px 28px 24px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
  }

  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .mark {
    width: 40px; height: 40px; border-radius: 11px; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    color: #fff; font-size: 18px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(47, 111, 237, .38);
  }
  .brand-text { min-width: 0; }
  .brand-text strong {
    display: block; font-size: 15.5px; font-weight: 600; letter-spacing: .2px;
  }
  .brand-text span {
    display: block; font-size: 10.5px; letter-spacing: 1.4px;
    text-transform: uppercase; color: var(--ink-3); margin-top: 1px;
  }

  h1 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
  .hint { margin: 0 0 20px; font-size: 12.5px; color: var(--ink-3); }

  .field { margin-bottom: 14px; }
  label { display: block; font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
  .input-wrap { position: relative; }
  input[type="text"], input[type="password"] {
    width: 100%; height: 42px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--panel-2);
    color: var(--ink);
    font-size: 14px; font-family: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  input[type="password"] { padding-right: 60px; }
  input::placeholder { color: #6d7a92; }
  input:focus {
    border-color: var(--accent);
    background: #1e293b;
    box-shadow: 0 0 0 3px rgba(47, 111, 237, .18);
  }
  .toggle {
    position: absolute; right: 6px; top: 6px;
    height: 30px; padding: 0 10px;
    border: 0; border-radius: 7px;
    background: transparent; color: var(--ink-3);
    font-size: 12px; font-family: inherit; cursor: pointer;
  }
  .toggle:hover { background: rgba(255, 255, 255, .06); color: var(--ink-2); }

  .err {
    display: flex; gap: 8px; align-items: flex-start;
    margin-bottom: 16px; padding: 10px 12px;
    background: var(--err-bg);
    border: 1px solid var(--err-line);
    border-radius: 9px;
    color: var(--err); font-size: 12.5px; line-height: 1.55;
  }
  .err[hidden] { display: none; }

  button.submit {
    width: 100%; height: 42px; margin-top: 6px;
    border: 0; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    color: #fff; font-size: 14.5px; font-weight: 500; font-family: inherit;
    cursor: pointer;
    transition: filter .15s, transform .06s;
  }
  button.submit:hover { filter: brightness(1.07); }
  button.submit:active { transform: translateY(1px); }
  button.submit:disabled { opacity: .65; cursor: default; }

  .foot {
    margin: 18px 0 0; padding-top: 14px;
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; gap: 10px;
    font-size: 11px; color: var(--ink-3);
  }

  @media (max-width: 480px) {
    body { padding: 16px; align-items: flex-start; padding-top: 8vh; }
    .card { padding: 24px 20px 20px; border-radius: 14px; }
    .foot { flex-direction: column; gap: 4px; }
  }
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <span class="mark" aria-hidden="true">图</span>
    <div class="brand-text">
      <strong>爱回收 · 商品图库</strong>
      <span>Image Assets</span>
    </div>
  </div>

  <h1>登录以继续</h1>
  <p class="hint">该图库仅对内部人员开放，请使用统一账号登录。</p>

  <div class="err" id="err" role="alert" aria-live="polite"{{ERR_HIDDEN}}>{{ERR_TEXT}}</div>

  <form method="post" action="/login" id="loginForm" autocomplete="on">
    <input type="hidden" name="next" value="{{NEXT}}">
    <div class="field">
      <label for="username">账号</label>
      <div class="input-wrap">
        <input id="username" name="username" type="text" value="{{USER_VALUE}}"
               placeholder="请输入账号" autocomplete="username" autocapitalize="off"
               spellcheck="false" required {{AUTOFOCUS_USER}}>
      </div>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <div class="input-wrap">
        <input id="password" name="password" type="password"
               placeholder="请输入密码" autocomplete="current-password" required {{AUTOFOCUS_PW}}>
        <button type="button" class="toggle" id="toggle" aria-label="显示密码">显示</button>
      </div>
    </div>
    <button type="submit" class="submit" id="submit">登录</button>
  </form>

  <p class="foot">
    <span>内部系统 · 请勿共享账号</span>
    <span>会话有效期 7 天</span>
  </p>
</main>

<script>
  (function () {
    var pw = document.getElementById('password');
    var btn = document.getElementById('toggle');
    btn.addEventListener('click', function () {
      var show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      btn.textContent = show ? '隐藏' : '显示';
      btn.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
      pw.focus();
    });
    // 提交后禁用按钮，避免重复提交触发限速
    document.getElementById('loginForm').addEventListener('submit', function () {
      var s = document.getElementById('submit');
      s.disabled = true;
      s.textContent = '登录中…';
    });
  })();
</script>
</body>
</html>
