services:
  gallery:
    build:
      context: .
      args:
        BASE_IMAGE: ${BACKEND_BASE_IMAGE:-python@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea}
    env_file:
      - .env
    ports:
      # 默认仅本机可达，用 SSH 隧道或 HTTPS 反向代理访问
      - "127.0.0.1:${GALLERY_PORT:-18080}:8000"
    networks:
      - default
      - white-gallery-internal
      - coverage-internal
    volumes:
      - ./data/model_params/current/model_params.json:/app/app/static/model_params.json:ro
      - ./runtime:/app/runtime
      - ./frontend-modules:/app/frontend-modules:ro
      - ./app/gaia_runtime:/app/gaia_runtime:ro
      # 图片资产库（V0.3）：图片文件 + gallery.db，只由入库脚本写入
      - ./v03data:/data/v03
    environment:
      - ASSET_ROOT=/data/v03
      - THUMB_DIR=/data/v03/thumbs
      - FRONTEND_MODULES_DIR=/app/frontend-modules
      - GAIA_MODEL_POOL_PATH=/app/gaia_runtime/gaia_model_pool.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
networks:
  white-gallery-internal:
    external: true
    name: gallery-white-api-internal
  coverage-internal:
    external: true
    name: gallery-coverage-api-internal
